project_name: trading_policy_oracle_repair
phase: 9
seed: 20260924

paths:
  data_root: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  outputs_dir: outputs
  checkpoints_dir: checkpoints

raw_data:
  provider: yfinance
  interval: 1d
  start: "2005-01-01"
  end: null
  auto_adjust: false
  actions: true
  repair: false
  keepna: false
  timeout_seconds: 30
  tickers: [AAPL, MSFT, AMZN, JPM, XOM, WMT]
  cash_proxy: "^IRX"

research_contract:
  signal_time: close
  execution_time: next_open
  cost_bps_per_side: 5.0
  horizon_days: 60
  embargo_days: 5
  start_exposures: [0.0, 0.25, 0.5, 0.75, 1.0]
  initial_train_years: 10
  calibration_years: 1
  test_years: 1
  bounded_switch_k_per_year: 10
  publication_data_quality_required: false

phase9:
  require_phase8_checkpoint: true
  phase8_processed_subdir: phase8
  processed_subdir: phase9
  alpha: 0.10
  utility_models: [ridge, gradient_boosting]
  primary_lcb_method: empirical
  deploy_margin: 0.0
  frontier_margins: [0.0, 0.0025, 0.005, 0.01, 0.02]
  bootstrap_block_length_dates: 20
  bootstrap_resamples: 50
  bootstrap_conservative_quantile: 0.10
  min_calibration_rows: 100
  evaluation_splits: [same_asset_test, asset_oos_test]
  write_csv_summaries: true
  evidence_sample_rows: 1000
  run_pytest: true
